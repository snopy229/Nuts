{% extends "base_template.html" %}
{% load wagtailcore_tags wagtailimages_tags %}
{% block content %}
    {% for block in page.banner %}
        {% image block.value.image original as img %}
    <section class="thanks overlay" style="background-image: url({{ img.url }})">
		<div class="container">
			<div class="row align-items-center justify-content-center">
				<div class="wrap">
					<h1>{{ block.value.title }}</h1>
					<p>{{ block.value.description }}</p>
				</div>
			</div>
		</div>
	</section>
    {% endfor %}
{% endblock content %}
